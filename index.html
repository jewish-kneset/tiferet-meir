<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kneset Display</title>
  <style>
    body { font-family: sans-serif; background:#0b1020; color:#eee;
           display:flex; align-items:center; justify-content:center;
           height:100vh; margin:0; text-align:center; }
    a { color: #6cf; }
  </style>
</head>
<body>
  <div>
    <h1 id="name">בית כנסת חכם</h1>
    <p>מסך התצוגה מנוהל באמצעות אפליקציית Smart Clock.</p>
    <p>עריכת תוכן: <a href="./admin/">/admin</a></p>
    <p id="tenant-info"></p>
  </div>
  <script>
    // Show the synagogue name from config.json
    fetch('./config.json').then(r=>r.json()).then(c=>{
      document.getElementById('name').textContent = c.tenant.displayName;
      document.getElementById('tenant-info').textContent =
        'מזהה בית הכנסת: ' + c.tenant.id;
    }).catch(()=>{});
  </script>
</body>
</html>
